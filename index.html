<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>아케인 타워</title>
<meta name="description" content="아홉 개의 서클, 백 층의 탑. 브라우저에서 바로 하는 픽셀 마법사 RPG.">
<meta property="og:title" content="아케인 타워">
<meta property="og:description" content="8속성 · 마법 50개 · 보스 20마리 · 신화 장비. 브라우저에서 바로 하는 픽셀 마법사 RPG.">
<meta name="theme-color" content="#0c1240">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap">
<style>
/* 레이아웃: 480x270 픽셀 캔버스를 정수배 확대. 1em = 게임 픽셀 8칸. HUD는 캔버스에, 글이 많은 창만 DOM. */
:root{color-scheme:dark;--bg:#04040a;--ink:#04050c;--edge:#dfe4ff;--w1:#2b3a8c;--w2:#0c1240;--text:#f3f4ff;--dim:#a3acdc;--gold:#ffe27a;--no:#ff8a8a;--ok:#8ef0a0;--px:2px}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;font-family:"Do Hyeon","Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#000;line-height:1.3}
#game{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair}
#scan{position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,0) 50%,rgba(0,0,0,.2) 50%);background-size:100% var(--px);box-shadow:inset 0 0 14em rgba(0,0,0,.45)}
#scan.off{display:none}
#ui{position:absolute;inset:0;pointer-events:none;text-shadow:.09em .09em 0 #000}
.win{background:linear-gradient(var(--w1),var(--w2));border:.2em solid var(--edge);border-radius:.45em;box-shadow:0 0 0 .15em var(--ink),inset 0 0 0 .15em var(--ink)}
button{font:inherit;color:var(--text);background:#18205a;border:.12em solid #8d9be0;border-radius:.3em;padding:.12em .7em;cursor:pointer;text-shadow:inherit}
button:hover{border-color:#fff;color:var(--gold)}
button:active{transform:translateY(.1em)}
button:focus-visible{outline:.12em solid var(--gold)}
button.dis{opacity:.38;pointer-events:none}
button.go{background:#3a2a9a;border-color:#c9b8ff}
button.muted{opacity:.5}
#zone{position:absolute;left:50%;top:.35em;transform:translateX(-50%);font-size:1.15em;white-space:nowrap}
#bossName{position:absolute;left:50%;top:1.55em;transform:translateX(-50%);font-size:.95em;color:#f0b8ff;white-space:nowrap}
#menuBtns{position:absolute;right:.6em;top:11.8em;display:flex;gap:.3em;pointer-events:auto;font-size:.8em}
#toasts{position:absolute;left:.6em;bottom:4.4em;display:flex;flex-direction:column-reverse;gap:.25em;font-size:.95em;max-width:46%}
#toasts div{background:rgba(6,8,26,.85);padding:.15em .6em;border-left:.2em solid var(--gold);animation:tin .18s steps(3)}
@keyframes tin{from{transform:translateX(-1.5em);opacity:0}}
#banner{position:absolute;left:0;right:0;top:27%;text-align:center;font-size:3.2em;color:#fff;text-shadow:.06em .06em 0 #3a2a8a,.12em .12em 0 #000;opacity:0;transition:opacity .2s steps(4)}
#banner small{display:block;font-size:.36em;color:var(--gold);margin-top:.2em}
#banner.on{opacity:1}
#labels div{position:absolute;transform:translate(-50%,-100%);font-size:.9em;white-space:nowrap;text-align:center;line-height:1.2}
#labels .pr{color:var(--gold);display:none}#labels .near .pr{display:block}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s steps(5)}#fade.on{opacity:1}
#panel{position:absolute;inset:0;background:rgba(2,3,10,.55);display:flex;align-items:center;justify-content:center;pointer-events:auto}
#panelBox{width:84%;max-height:88%;display:flex;flex-direction:column}
#panelHead{display:flex;justify-content:space-between;align-items:center;padding:.4em .9em;border-bottom:.12em solid rgba(223,228,255,.35)}
#panelTitle{font-size:1.35em;color:var(--gold)}#panelWallet{margin-left:auto;margin-right:.6em;display:flex;gap:.7em;font-size:.85em;align-items:center}#panelWallet span{display:flex;align-items:center;gap:.2em;color:#ffe27a}#panelWallet img{width:1.3em;height:1.3em;image-rendering:pixelated}
#panelBody{padding:.6em 1em .8em;overflow-y:auto;font-size:1em}
#panelBody p{margin:.15em 0 .5em;color:var(--dim)}
.say{display:flex;gap:.8em;align-items:flex-start;margin-bottom:.4em}
.say img{width:3.4em;height:3.8em;image-rendering:pixelated;flex:none}
.say p{margin:0!important;color:var(--text)!important}
.li{display:flex;align-items:center;gap:.6em;padding:.3em .1em;border-bottom:.1em dashed rgba(160,175,255,.25)}
.li>img{width:2.3em;height:2.3em;image-rendering:pixelated;flex:none}
.li .gr{flex:1;min-width:0}
.li .ds{color:var(--dim);font-size:.85em}
.li .bt{display:flex;gap:.3em;flex-wrap:wrap;justify-content:flex-end}
.li.lock{opacity:.45}
.hd{color:var(--gold);margin:.7em 0 .1em;font-size:1.05em;display:flex;justify-content:space-between}
.hd span{color:var(--dim);font-size:.8em}
.tag{font-size:.8em;padding:0 .35em;border-radius:.2em;background:rgba(0,0,0,.4)}
img.ic{image-rendering:pixelated;height:1.1em;vertical-align:-.15em;margin-right:.15em}
.tabs{display:flex;gap:.35em;margin-bottom:.5em;flex-wrap:wrap}.tabs button.on{background:#3a2a9a;border-color:#fff}
.gold{color:var(--gold)}.no{color:var(--no)}.dim{color:var(--dim)}.ok{color:var(--ok)}
.inv{display:grid;grid-template-columns:repeat(8,1fr);gap:.3em}.sellbar{margin-top:.4em;display:flex;flex-wrap:wrap;gap:.25em;align-items:center}.sellbar>span{font-size:.85em;color:#a8a4b8}.sellbar .sr{padding:.15em .45em;font-size:.8em;border:1px solid var(--rc);color:var(--rc);background:transparent;opacity:.5}.sellbar .sr.on{opacity:1;background:rgba(255,255,255,.08)}.sec{font-size:.85em;color:#c8b48a;margin:.2em 0 .3em;border-bottom:1px solid #4a3a28}.wallet{display:flex;flex-wrap:wrap;gap:.3em .8em;margin-bottom:.6em;padding:.3em .5em;background:rgba(0,0,0,.25);border:1px solid #4a3a28;border-radius:4px}.wallet .sec{width:100%;margin:0}.wl{display:flex;align-items:center;gap:.3em}.wl img{width:1.4em;height:1.4em;image-rendering:pixelated}.wl span{color:#a8a4b8;font-size:.85em}.wl b{color:#ffe27a}
.cell{aspect-ratio:1;background:var(--ink);border:.12em solid #39407a;border-radius:.15em;position:relative;cursor:pointer}
.cell img{width:100%;height:100%;image-rendering:pixelated;display:block}
.cell u{position:absolute;right:.1em;bottom:0;font-size:.75em;text-decoration:none}
.cell.sel{outline:.15em solid #fff}
.two{display:flex;gap:1em}.two>div{flex:1;min-width:0}
.eqs{display:flex;gap:.4em;margin-bottom:.5em}.eqs .cell{width:2.6em;flex:none}
.ladder{display:grid;grid-template-columns:repeat(9,1fr);gap:.2em;margin:.4em 0;text-align:center;font-size:.75em}
.ladder div{padding:.25em 0;border-radius:.2em;background:rgba(0,0,0,.35);color:var(--dim)}
.ladder div.on{color:#05060f;font-weight:bold}
.slots{display:flex;gap:.3em;flex-wrap:wrap;margin-bottom:.4em}
.slots div{width:2.3em;height:2.3em;background:var(--ink);border:.12em solid #39407a;position:relative}
.slots img{width:100%;height:100%;image-rendering:pixelated}
.slots b{position:absolute;left:.15em;top:0;font-size:.7em;color:var(--gold)}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6em;pointer-events:auto;background:radial-gradient(ellipse at 50% 42%,rgba(4,5,12,.15),rgba(4,5,12,.88) 72%)}
#title h1{font-size:4.6em;margin:0;color:#fff;letter-spacing:.04em;text-shadow:.05em .05em 0 #4a2fa0,.1em .1em 0 #04050c}
#title .sub{font-size:1.15em;margin:0;color:var(--gold)}
#title .menu{display:flex;flex-direction:column;gap:.1em;padding:.5em 1.6em .5em 1em;margin-top:.4em}
#title .menu button{font-size:1.3em;background:none;border:0;text-align:left;padding:.1em .3em}
#title .menu button::before{content:'▶ ';visibility:hidden;color:var(--gold)}
#title .menu button:hover::before,#title .menu button:focus-visible::before{visibility:visible}
#title .keys{font-size:.8em;color:var(--dim);text-align:center;line-height:1.5;margin-top:.4em}
#pick{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:88%;padding:.7em 1.2em .9em;pointer-events:auto}
#pick h2{margin:0;font-size:1.5em;color:var(--gold);font-weight:normal}
#pick p{margin:.2em 0 .6em;color:var(--dim);font-size:.9em}
#pickGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4em}
.pk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.1em;padding:.4em .3em;background:rgba(0,0,0,.28);border:.12em solid transparent;border-radius:.3em;cursor:pointer;font:inherit;color:inherit}
.pk:hover,.pk:focus-visible{border-color:#fff;background:rgba(255,255,255,.06)}
.pk img{width:2.8em;height:2.8em;image-rendering:pixelated}
.pk b{font-size:1.2em;font-weight:normal}
.pk span{font-size:.75em;color:var(--dim)}
#touch{position:absolute;inset:0;pointer-events:none;display:none}
#touch button{position:absolute;pointer-events:auto;width:4.2em;height:4.2em;border-radius:50%;font-size:1em;opacity:.85;padding:0}
#tF{right:1.2em;bottom:15.5em}#tB{right:6.2em;bottom:14.5em}#joy2{position:absolute;width:9em;height:9em;border-radius:50%;background:rgba(255,80,100,.08);border:.15em solid rgba(255,140,160,.35);display:none;transform:translate(-50%,-50%);pointer-events:none}#joy2 i{position:absolute;left:50%;top:50%;width:3.6em;height:3.6em;margin:-1.8em;border-radius:50%;background:rgba(255,140,160,.4)}#bAuto.on{background:#3a7a3a;color:#fff}
#joy{position:absolute;width:9em;height:9em;border-radius:50%;background:rgba(255,255,255,.07);border:.15em solid rgba(255,255,255,.25);display:none;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:3.6em;height:3.6em;margin:-1.8em;border-radius:50%;background:rgba(255,255,255,.3)}
.mbar{height:.35em;background:#161a36;border:.08em solid #04050c;margin:.25em 0}.mbar i{display:block;height:100%;background:linear-gradient(90deg,#7a4ac8,#c79bff)}
#forge{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(2,3,10,.72);gap:.5em;cursor:pointer;text-align:center;font-size:1.05em}
#forgeCv{width:min(70%,38em);aspect-ratio:160/96;image-rendering:pixelated;border:.2em solid #dfe4ff;border-radius:.3em;box-shadow:0 0 0 .15em #04050c}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="480" height="270"></canvas>
  <div id="scan"></div>
  <div id="ui">
    <div id="labels"></div>
    <div id="hud" hidden>
      <div id="zone"></div>
      <div id="bossName" hidden></div>
      <div id="menuBtns"><button id="bInv">가방</button><button id="bBag">메뉴</button><button id="bScan">CRT</button><button id="bSnd">소리</button><button id="bAuto">수동</button><button id="bFull">전체화면</button></div>
      <div id="toasts"></div>
      <div id="banner"></div>
      <div id="touch"><div id="joy"><i id="joyK"></i></div><button id="tF">F</button><button id="tB">순간<br>이동</button></div><div id="joy2"><i id="joy2K"></i></div>
    </div>
    <div id="panel" hidden><div id="panelBox" class="win"><div id="panelHead"><span id="panelTitle"></span><span id="panelWallet"></span><button id="panelX">닫기</button></div><div id="panelBody"></div></div></div>
    <div id="forge" hidden><canvas id="forgeCv" width="160" height="96"></canvas><div id="forgeMsg"></div></div>
    <div id="fade"></div>
    <div id="title">
      <h1>아케인 타워</h1>
      <p class="sub">아홉 개의 서클, 백 층의 심연의 탑</p>
      <div class="menu win"><button id="bCont" hidden>이어하기</button><button id="bNew">새로 시작</button></div>
      <div class="keys">WASD 이동 · 마우스 조준, 클릭 매직 애로우 · 1~8 마법 · Space 순간이동(이동 방향)<br>F 대화·포탈·상자 · R 신화 스킬 · Q/E 물약 · Tab 메뉴 · L CRT · M 소리</div>
    </div>
    <div id="pick" class="win" hidden>
      <h2>속성을 고르세요</h2>
      <p>처음 고른 속성이 주 속성이 됩니다(피해 +20%). 4서클과 7서클에서 속성을 하나씩 더 깨우고, 9서클에 오르면 모든 속성을 다룹니다.</p>
      <div id="pickGrid"></div>
    </div>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   아케인 타워 — 단일 파일 픽셀 마법사 RPG
   모든 그림: 픽셀 그리드/스캔라인 다각형 → 캔버스. 모든 소리: Web Audio 합성.
   ===================================================================== */
const W=480,H=270;
const $=id=>document.getElementById(id);
const cv=$('game'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const mkC=(w,h)=>{if(typeof OffscreenCanvas!=='undefined')return new OffscreenCanvas(w,h);const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const g2=c=>{const g=c.getContext('2d');g.imageSmoothingEnabled=false;return g};

/* ============================ AUDIO ============================ */
const AU={ctx:null};
function initAudio(){
  if(AU.ctx){AU.ctx.resume&&AU.ctx.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  let c;try{c=AU.ctx=new C()}catch(e){return}
  AU.master=c.createGain();AU.master.gain.value=S.mute?0:.8;AU.master.connect(c.destination);
  AU.mus=c.createGain();AU.mus.gain.value=.4;AU.mus.connect(AU.master);
  AU.sfx=c.createGain();AU.sfx.gain.value=.6;AU.sfx.connect(AU.master);
  const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=b;
  setInterval(schedule,30);
}
function _tone(type,f0,f1,dur,vol,t,dest){
  const c=AU.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(dest||AU.sfx);o.start(t);o.stop(t+dur+.02);
}
function _noiz(dur,vol,f0,f1,t,dest,type){
  const c=AU.ctx;if(!c)return;const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=AU.noise;s.loop=true;f.type=type||'lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest||AU.sfx);s.start(t,Math.random());s.stop(t+dur+.02);
}
const tone=(ty,f0,f1,d,v,w=0)=>AU.ctx&&_tone(ty,f0,f1,d,v,AU.ctx.currentTime+w);
const noiz=(d,v,f0,f1,w=0,ty)=>AU.ctx&&_noiz(d,v,f0,f1,AU.ctx.currentTime+w,null,ty);
let lastHitS=0;
const sfx={
  shoot(){tone('square',920,480,.06,.05)},
  clang(){tone('square',1800,1650,.09,.06);tone('triangle',2700,2600,.35,.05);tone('sine',180,90,.12,.18);noiz(.06,.28,9000,3000,0,'highpass')},
  hit(){const n=performance.now();if(n-lastHitS<45)return;lastHitS=n;noiz(.05,.15,3000,800);tone('square',220,110,.05,.04)},
  crit(){const n=performance.now();if(n-lastHitS<45)return;lastHitS=n;noiz(.08,.24,5000,900);tone('square',660,1320,.09,.06)},
  fire(){noiz(.25,.2,400,2400);tone('sawtooth',300,120,.2,.06)},
  boom(){noiz(.45,.42,1800,80);tone('sine',120,30,.4,.42)},
  bigboom(){noiz(.9,.65,2500,50);tone('sine',90,22,.8,.65);tone('square',60,30,.5,.1)},
  zap(){noiz(.18,.28,8000,3000,0,'highpass');tone('sawtooth',1800,200,.16,.08);tone('square',2400,300,.1,.04,.03)},
  frost(){tone('sine',2000,500,.4,.11);tone('triangle',3000,1200,.3,.06,.05);noiz(.3,.11,9000,5000,0,'highpass')},
  water(){noiz(.3,.22,1400,300);tone('sine',700,220,.2,.09)},
  splash(){noiz(.45,.3,2200,200);tone('sine',320,80,.3,.14)},
  wind(){noiz(.45,.3,500,3200,0,'bandpass');noiz(.3,.15,2000,600,.1,'bandpass')},
  earth(){noiz(.4,.38,500,60);tone('sine',90,40,.35,.32)},
  holy(){[1047,1319,1568,2093].forEach((f,i)=>tone('triangle',f,f,.28,.055,i*.05))},
  dark(){tone('sine',320,60,.5,.18);tone('sawtooth',80,40,.4,.05)},
  arcane(){tone('square',700,1400,.08,.045)},
  meteor(){tone('sawtooth',1000,90,1.2,.07);tone('square',1500,140,1.2,.03)},
  coin(){tone('square',988,988,.06,.06);tone('square',1319,1319,.12,.06,.06)},
  gem(){tone('triangle',1200+rnd(400),1900,.06,.05)},
  hurt(){tone('sawtooth',300,80,.2,.18);noiz(.12,.18,1500,300)},
  lvl(){[523,659,784,1047,1319].forEach((f,i)=>tone('square',f,f,.14,.08,i*.08))},
  ui(){tone('square',660,880,.05,.045)},
  err(){tone('square',160,120,.12,.06)},
  buy(){tone('square',784,784,.07,.06);tone('square',1175,1175,.14,.06,.07)},
  portal(){tone('sine',200,1200,.6,.14);tone('triangle',400,2400,.6,.05)},
  blink(){tone('sine',1400,300,.12,.09)},
  die(){[440,370,311,220,147].forEach((f,i)=>tone('sawtooth',f,f*.9,.25,.11,i*.16))},
  clear(){[659,784,988,1319,988,1319,1568].forEach((f,i)=>tone('square',f,f,.12,.08,i*.09))},
  potion(){tone('sine',400,900,.2,.11)},
  spawn(){tone('triangle',150,400,.25,.04)},
  item(){tone('triangle',1047,1047,.1,.09);tone('triangle',1568,1568,.2,.09,.1)},
  circle(){[262,330,392,523,659,784,1047,1568].forEach((f,i)=>{tone('triangle',f,f,.5,.09,i*.1);tone('square',f*2,f*2,.2,.025,i*.1)})},
  roar(){tone('sawtooth',110,45,.9,.22);noiz(.9,.28,900,150)}
};
const CAST_SFX={fire:'fire',water:'water',ice:'frost',wind:'wind',earth:'earth',thunder:'zap',holy:'holy',dark:'dark',none:'arcane'};
const IMP_SFX={fire:'boom',water:'splash',ice:'frost',wind:'wind',earth:'earth',thunder:'zap',holy:'holy',dark:'dark',none:'boom'};
const impSfx=(el,big)=>{if(big&&(el==='fire'||el==='none'||el==='earth'))sfx.bigboom();else sfx[IMP_SFX[el]||'boom']()};
const SONGS={
  town:{bpm:100,lead:'square',lv:.045,ch:[[60,64,67],[55,59,62],[57,60,64],[53,57,60]],

function pxPoly(g,pts,col){
  g.fillStyle=col;let y0=1e9,y1=-1e9;for(const p of pts){if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1]}
  y0=Math.ceil(y0-.5);y1=Math.floor(y1-.5);if(y1-y0>400)return;const n=pts.length,xs=[];
  for(let y=y0;y<=y1;y++){const cy=y+.5;xs.length=0;
    for(let i=0,j=n-1;i<n;j=i++){const a=pts[i],b=pts[j];if((a[1]>cy)!==(b[1]>cy))xs.push(a[0]+(cy-a[1])/(b[1]-a[1])*(b[0]-a[0]))}
    xs.sort((p,q)=>p-q);for(let k=0;k+1<xs.length;k+=2){const xa=Math.round(xs[k]),xb=Math.round(xs[k+1]);if(xb>xa)g.fillRect(xa,y,xb-xa,1)}}
}
function pxEll(g,cx,cy,rx,ry,col){g.fillStyle=col;cx=Math.round(cx);cy=Math.round(cy);if(rx<.5||ry<.5)return;const R=Math.round(ry);for(let y=-R;y<=R;y++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry))));g.fillRect(cx-w,cy+y,w*2+1,1)}}

function pxRing(g,cx,cy,rx,ry,col,n){if(rx<1)return;g.fillStyle=col;n=n||Math.max(12,Math.ceil((rx+ry)*3.2));for(let i=0;i<n;i++){const a=i/n*TAU;g.fillRect(Math.round(cx+Math.cos(a)*rx),Math.round(cy+Math.sin(a)*ry),1,1)}}
function pxLine(g,x0,y0,x1,y1,col){g.fillStyle=col;x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy,n=0;while(n++<700){g.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}

function sparkle(x,y,s,col,core){
  x=Math.round(x);y=Math.round(y);s=Math.round(s);if(s<1)return;ctx.fillStyle=col;
  ctx.fillRect(x-s,y,s*2+1,1);ctx.fillRect(x,y-s,1,s*2+1);

function mkSpellIcon(sp){
  const c=mkC(18,18),g=g2(c),C=EL[sp.el].c;
  const fr=sp.c>=9?null:sp.c>=7?['#ffd84a','#8a6a1a']:sp.c>=4?['#d8dee9','#6a7488']:['#c98f6b','#6b4426'];
  g.fillStyle='#04050c';g.fillRect(0,0,18,18);
  if(fr){g.fillStyle=fr[0];g.fillRect(1,1,16,16);g.fillStyle=fr[1];g.fillRect(2,16,15,1);g.fillRect(16,2,1,15)}
  else{const R=['#ff5a5a','#ffaa4a','#ffe27a','#7ee0a6','#6fd3ff','#c79bff'];for(let i=0;i<16;i++){g.fillStyle=R[(i>>1)%6];g.fillRect(1+i,1,1,1);g.fillRect(16,1+i,1,1);g.fillRect(16-i,16,1,1);g.fillRect(1,16-i,1,1)}}
  g.fillStyle='#0b0d24';g.fillRect(2,2,14,14);
  g.globalAlpha=.55;g.fillStyle=C[3];g.fillRect(2,9,14,7);g.globalAlpha=.25;g.fillRect(2,5,14,4);g.globalAlpha=1;
  const d=ICONS[sp.id];if(d){g.save();g.beginPath();g.rect(2,2,14,14);g.clip();d(g,C);g.restore()}
  g.globalCompositeOperation='destination-over';g.fillStyle='#0b0d24';g.fillRect(0,0,18,18);g.globalCompositeOperation='source-over';
  return c;
}

  else if(st==='poison'){e.poi=Math.max(e.poi,4.5);e.poiD=Math.max(e.poiD||0,dmg*.5)}
  else if(st==='slow')e.slow=Math.max(e.slow,t||2);
  else if(st==='stun')e.stun=Math.max(e.stun,(t||.5)*(e.boss?.35:1));
  else if(st==='freeze'){if(e.boss)e.slow=Math.max(e.slow,3);else e.frozen=Math.max(e.frozen,t||2)}
  else if(st==='weak')e.weak=Math.max(e.weak,t||4);

  if(Math.random()<.35)part(e.x+rnd(-12,12),e.y-rnd(0,40),rnd(-6,6),rnd(-24,-8),.6,pick(['#c94cff','#7a26c8','#ff3a3a']),1);
  const m=d>130?1:d<90?-1:0;chase(e,(ux*m+uy*.6)*sp*dt,(uy*m-ux*.6)*sp*dt,e.r-2);
  if(e.cd<=0&&!G.dead){e.cd=ph2?1.7:2.5;e.ph=(e.ph+1)%4;const ox=e.x,oy=e.y-30;
    if(e.ph===0){const n=ph2?18:12,o=rnd(TAU);for(let i=0;i<n;i++)ebullet(ox,oy,o+i/n*TAU,75,e.dmg,i%2?'#c94cff':'#ff3a3a',3);darkBurst(ox,oy+4,20,null,false);sfx.dark()}
    else if(e.ph===1){const a0=Math.atan2(p.y-8-oy,p.x-ox),k=ph2?5:3;for(let i=0;i<k;i++)tlLine(ox,oy,a0+(i-(k-1)/2)*.38,420,9,.85,e.dmg*1.4,'#ff3a3a');tone('square',200,800,.6,.04)}
    else if(e.ph===2){if(G.en.length<9){minions(e,'cultist',2);minions(e,ph2?'darkmage':'cultist',ph2?2:1)}sfx.roar()}
    else{darkBurst(e.x,e.y,30,null,false);const s=spawnPos(110);e.x=s.x;e.y=s.y;darkBurst(e.x,e.y,30,null,false);sfx.blink();const n=ph2?6:4;for(let i=0;i<n;i++){const b=ebullet(e.x,e.y-30,i/n*TAU,70,e.dmg,'#c94cff',3);b.hm=1.8}}}
}



/* ===== 플레이어 디버프 · 보스 기믹 (공간 봉쇄, 차원 붕괴, 생명 흡수, 분신) ===== */
const DB={poison:{n:'중독',c:'#7ae05a',dot:.03},burn:{n:'화상',c:'#ff7a2a',dot:.04},bleed:{n:'출혈',c:'#e5484d',dot:.025},silence:{n:'침묵',c:'#c8a0ff'},curse:{n:'저주',c:'#a03ac8'},blind:{n:'실명',c:'#5a5a6a'},freeze:{n:'빙결',c:'#9ae0ff'}};
function applyDb(k,t){const p=G.p;if(G.dead)return;if((k==='curse'&&hasM('pharaohRobe'))||(k==='bleed'&&hasM('knightCloak'))||(k==='burn'&&hasM('magmaCore'))||(k==='blind'&&hasM('shadowStaff')))return;p.db=p.db||{};const had=(p.db[k]||0)>0;p.db[k]=Math.max(p.db[k]||0,t);if(!had){G.texts.push({x:p.x,y:p.y-40,vy:-18,life:1,str:DB[k].n+'!',col:DB[k].c,sc:1});burst(p.x,p.y-12,12,[DB[k].c,'#ffffff'],50,.4)}}
const healMul=()=>(G.p&&G.p.db&&G.p.db.curse>0)?.4:1;
function dotPlayer(v){const p=G.p;if(G.dead)return;if(p.hp-v<=0){p.ifr=0;hurtPlayer(v*9)}else{p.hp-=v;if(Math.random()<.3)G.texts.push({x:p.x+rnd(-6,6),y:p.y-30,vy:-20,life:.6,str:'-'+Math.round(v),col:'#ff9a9a',sc:.8})}}
function updDb(p,dt){if(!p.db)return;for(const k in p.db){if(p.db[k]<=0)continue;p.db[k]-=dt;const d=DB[k];if(d.dot){p.dbT=(p.dbT||{});p.dbT[k]=(p.dbT[k]||0)-dt;if(p.dbT[k]<=0){p.dbT[k]=.5;dotPlayer(D.maxHp*d.dot*.5)}if(Math.random()<.3)part(p.x+rnd(-5,5),p.y-rnd(4,20),0,rnd(-24,-8),.5,d.c,1)}}}
function dbZone(x,y,R,dur,dmg,col,col2,db,dbt){addFx({layer:'g',t:0,tk:0,upd(dt){this.t+=dt;this.tk-=dt;const P=G.p;if(this.tk<=0&&this.t>.4&&Math.hypot(P.x-x,(P.y-y)*1.4)<R){this.tk=.5;if(dmg)hurtPlayer(dmg);if(db)applyDb(db,dbt)}if(Math.random()<.5){const a=rnd(TAU),r=Math.sqrt(Math.random())*R;part(x+Math.cos(a)*r,y+Math.sin(a)*r*.62,rnd(-6,6),rnd(-14,-4),rnd(.6,1),pick([col,col2]),rnd(2,3),{pf:1})}return this.t<dur},
  draw(){const f=Math.max(0,Math.min(1,this.t/.4,(dur-this.t)/.4));ctx.globalAlpha=.3*f;pxEll(ctx,x,y,R,R*.62,col);ctx.globalAlpha=1;pxRing(ctx,x,y,R,R*.62,col2);if((this.t*6|0)%2)pxRing(ctx,x,y,R-2,(R-2)*.62,col,24)}})}
function barrier(e,R0,R1,dur,dmg){const P=G.p,cx=(P.x+e.x)/2,cy=(P.y+e.y)/2;banner('공간 봉쇄','빛나는 원 밖으로 나가면 피해를 입습니다');addFx({layer:'t',t:0,tk:0,upd(dt){this.t+=dt;this.tk-=dt;const R=R0+(R1-R0)*Math.min(1,this.t/(dur*.7)),P=G.p;if(this.t>.8&&this.tk<=0&&Math.hypot(P.x-cx,(P.y-cy)*1.4)>R){this.tk=.4;P.ifr=0;hurtPlayer(dmg)}return this.t<dur&&!e.dead},
  draw(){const R=R0+(R1-R0)*Math.min(1,this.t/(dur*.7));pxRing(ctx,cx,cy,R,R*.62,'#ff3a3a');pxRing(ctx,cx,cy,R+2,(R+2)*.62,'#ffffff',48);ctx.globalAlpha=.18;ctx.fillStyle='#3a0010';const W2=G.map.pw,H2=G.map.ph;ctx.fillRect(0,0,W2,Math.max(0,cy-R*.62));ctx.fillRect(0,cy+R*.62,W2,H2);ctx.fillRect(0,cy-R*.62,Math.max(0,cx-R),R*1.24);ctx.fillRect(cx+R,cy-R*.62,W2,R*1.24);ctx.globalAlpha=1}})}
function rift(x,y,R,dur,dmg,pull){addFx({layer:'g',t:0,tk:0,upd(dt){this.t+=dt;this.tk-=dt;const P=G.p,dx=x-P.x,dy=y-P.y,d=Math.hypot(dx,dy)||1;if(this.t>.6&&d<R*2.2&&!G.dead){const f=(pull||45)*dt*(1-d/(R*2.4));if(!boxSol(P.x+dx/d*f,P.y-3,5))P.x+=dx/d*f;if(!boxSol(P.x,P.y-3+dy/d*f,5))P.y+=dy/d*f}if(this.t>.6&&d<R*.55&&this.tk<=0){this.tk=.4;P.ifr=0;hurtPlayer(dmg)}if(Math.random()<.9){const a=rnd(TAU),r=R*rnd(1.2,2);part(x+Math.cos(a)*r,y+Math.sin(a)*r*.62,-Math.cos(a)*r*1.5,-Math.sin(a)*r,.6,pick(['#c94cff','#000000','#ff7ad9']),2)}return this.t<dur},
  draw(){const k=Math.min(1,this.t/.6),sp=G.time*4;ctx.fillStyle='#000';pxEll(ctx,x,y,R*.55*k,R*.34*k,'#000000');for(let i=0;i<3;i++)pxArc(ctx,x,y,R*k*(.6+i*.25),R*k*(.6+i*.25)*.62,sp+i*2,sp+i*2+2.4,i%2?'#c94cff':'#ff7ad9');pxRing(ctx,x,y,R*.55*k,R*.34*k,'#ffffff',30)}})}
function tether(e,dur,range){const P=G.p;banner('생명 흡수','멀리 떨어져 연결을 끊으세요');addFx({layer:'t',t:0,tk:0,on:true,upd(dt){this.t+=dt;this.tk-=dt;const P=G.p,d=Math.hypot(P.x-e.x,P.y-e.y);if(this.on&&d>range){this.on=false;G.texts.push({x:P.x,y:P.y-40,vy:-18,life:1,str:'연결 끊김',col:'#ffffff',sc:1});return false}if(this.tk<=0){this.tk=.5;const v=D.maxHp*.035;dotPlayer(v);e.hp=Math.min(e.max,e.hp+e.max*.006);part(e.x,e.y-e.hh*.5,0,-20,.6,'#8ef0a0',2)}return this.t<dur&&!e.dead&&!G.dead},
  draw(){const P=G.p,n=10;for(let i=0;i<=n;i++){const k=i/n,x=e.x+(P.x-e.x)*k,y=e.y-e.hh*.5+(P.y-10-(e.y-e.hh*.5))*k+Math.sin(G.time*14+i)*2;ctx.fillStyle=i%2?'#e5484d':'#ff9a9a';ctx.fillRect(Math.round(x)-1,Math.round(y)-1,3,3)}const d=Math.hypot(P.x-e.x,P.y-e.y);pxRing(ctx,e.x,e.y,range,range*.62,'#e5484d',60)}})}
function mkClones(e,n,hpF){for(let i=0;i<n;i++){const s=spawnPos(70),c=mkEnemy(e.type,s.x,s.y,false);c.boss=0;c.clone=1;c.noDrop=1;c.xp=0;c.hp=c.max=e.max*hpF;c.dmg=e.dmg*.6;c.cd=rnd(1,2);burst(s.x,s.y-12,20,[MON[e.type].bc||'#c94cff','#ffffff'],80,.5);G.en.push(c)}sfx.blink()}
function cloneAI(e,dt,p,d,ux,uy,sp){e.z=MON[e.type].fly?6+Math.sin(e.t*2.4)*3:0;const m=d>120?1:d<70?-1:0,sd=Math.sin(e.t*.9)>0?1:-1;chase(e,(ux*m-uy*sd*.6)*sp*dt,(uy*m+ux*sd*.6)*sp*dt,e.r-2);e.cd-=dt;if(e.cd<=0&&!G.dead){e.cd=rnd(1.6,2.4);const col=MON[e.type].bc||'#c94cff',a=Math.atan2(p.y-10-(e.y-e.hh*.55),p.x-e.x);for(let i=-1;i<=1;i++)ebullet(e.x,e.y-e.hh*.55,a+i*.2,110,e.dmg,col,3)}if(d<e.r+6)hurtPlayer(e.dmg)}
const SIG2_N={shroomLord:'맹독 포자',arachne:'독니',gargLord:'석상 분신',golemlord:'공간 봉쇄',wispLord:'절대 빙결',ymir:'혹한의 숨결',pharaoh:'파라오의 저주',lich:'생명 흡수',cerberus:'지옥견의 이빨',ifrit:'업화',stormKing:'감전',harpyQ:'환영 분신',deathLord:'피의 계약',archon:'암흑의 장막',magmaTitan:'용암 침식',dragon:'차원 붕괴',shadowKing:'그림자 군단',demonLord:'심연 붕괴'};
function bossSig2(e,p){
  const T=bossT(),col=MON[e.type].bc||'#ff3a3a',oy=e.y-e.hh*.55,td=1-T*.3,sv=1+T*.5,W=G.map.pw,H=G.map.ph,dm=e.dmg;
  G.texts.push({x:e.x,y:e.y-e.hh-28,vy:-10,life:1.6,str:'《'+SIG2_N[e.type]+'》',col:'#ff9a9a',sc:1.1});

    case'shroomLord':{for(let i=0;i<5;i++){const tx=clamp(p.x+rnd(-90,90),30,W-30),ty=clamp(p.y+rnd(-55,55),56,H-30);later(i*.15,()=>dbZone(tx,ty,26,6,0,'#3a8a2a','#7ae05a','poison',4))}for(let i=0;i<4;i++){const b=shot(i/4*TAU,70,'poison',4,'#7ae05a',4);b.hm=2}break}
    case'arachne':{const a=aim();for(let i=-3;i<=3;i++)shot(a+i*.14,140*sv,'poison',5,'#7ae05a');for(let i=0;i<3;i++)dbZone(clamp(p.x+rnd(-60,60),30,W-30),clamp(p.y+rnd(-40,40),56,H-30),24,6,0,'#eaeaf0','#ffffff','freeze',.5);break}
    case'gargLord':mkClones(e,2,.06);break;
    case'golemlord':barrier(e,220,80,7,dm*.8);break;
    case'wispLord':{for(let w=0;w<2;w++)later(w*.5,()=>{if(e.dead)return;const n=16;for(let i=0;i<n;i++)shot(i/n*TAU+w*.2,80*sv,'freeze',1,'#bfe9ff')});break}
    case'ymir':{const a=aim();for(let i=0;i<24;i++)later(i*.04,()=>{if(!e.dead)shot(a+rnd(-.45,.45),rnd(100,150)*sv,i%3?null:'freeze',.8,'#bfe9ff')});dbZone(p.x,p.y,50,5,dm*.3,'#6fa8d0','#ffffff',null,0);for(let i=0;i<3;i++)dbZone(clamp(p.x+rnd(-80,80),30,W-30),clamp(p.y+rnd(-50,50),56,H-30),30,5,dm*.2,'#6fa8d0','#bfe9ff','freeze',.6);break}
    case'pharaoh':{const tx=p.x,ty=p.y;telegraph(tx,ty,46,1.1*td,dm,'#a03ac8',()=>{if(Math.hypot(G.p.x-tx,G.p.y-ty)<50){applyDb('curse',8);applyDb('silence',1.5)}});minions(e,'scarab',3);break}
    case'lich':tether(e,6,170);for(let i=0;i<6;i++){const b=shot(i/6*TAU,60,'curse',5,'#b8f27a');b.hm=1.5}break;
    case'cerberus':{e.st='wind';e.stT=.5*td;const a=aim();e.dx=Math.cos(a);e.dy=Math.sin(a);e.combo=2;tlLine(e.x,e.y-6,a,220,e.r,.5*td,e.dmg*1.3,col);for(let i=0;i<10;i++)shot(i/10*TAU,90*sv,'bleed',5,'#e5484d');break}
    case'ifrit':{for(let i=0;i<6;i++){const tx=clamp(p.x+rnd(-110,110),30,W-30),ty=clamp(p.y+rnd(-65,65),56,H-30);later(i*.12,()=>dbZone(tx,ty,30,6,dm*.3,'#8a2a0a','#ff7a2a','burn',3))}const a=aim();for(let i=-4;i<=4;i++)shot(a+i*.12,130*sv,'burn',3,'#ff7a2a');break}
    case'stormKing':{for(let i=0;i<4;i++)later(i*.35,()=>{if(e.dead)return;const tx=G.p.x+rnd(-14,14),ty=G.p.y+rnd(-8,8);telegraph(tx,ty,28,.6*td,dm,'#fff38a',()=>{boltFx(tx,ty-140,tx,ty,.3);if(Math.hypot(G.p.x-tx,G.p.y-ty)<32)applyDb('silence',2.5)})});break}

    case'archon':applyDb('blind',5);G.flash=.3;G.flashCol='#000000';for(let i=0;i<6;i++){const b=shot(i/6*TAU,65,'curse',4,'#c94cff',4);b.hm=2.2}if(G.en.length<9)minions(e,'cultist',2);break;
    case'magmaTitan':{for(let i=0;i<7;i++){const tx=rnd(40,W-40),ty=rnd(70,H-40);later(i*.2,()=>{if(!e.dead)telegraph(tx,ty,30,.8*td,dm,'#ff5a1a',()=>dbZone(tx,ty,34,9,dm*.3,'#8a2a0a','#ff9a3c','burn',3))})}shake(8);break}
    case'dragon':{banner('차원 붕괴','틈에 빨려 들어가지 마세요');for(let i=0;i<3;i++){const s=spawnPos(80);later(i*.4,()=>{if(!e.dead)rift(s.x,s.y,36,6,dm,50)})}G.flash=.3;G.flashCol='#2a0040';shake(10);sfx.bigboom();break}

  }
}
/* ===== 보스 전용 패턴: 보스마다 하나씩, 일정 시간마다 쓴다 ===== */
const SIG_N={ratKing:'쥐떼 질주',shroomLord:'포자 개화',gargLord:'석화의 눈',wispLord:'빙결 궤도',pharaoh:'모래 기둥',cerberus:'세 머리의 숨결',stormKing:'뇌전 결계',deathLord:'검의 감옥',magmaTitan:'용암 팔',shadowKing:'거울 분신',
  kingslime:'분열 젤리',arachne:'거미줄 감옥',golemlord:'대지 균열',ymir:'눈사태',lich:'죽음의 낙인',ifrit:'화염 수레바퀴',harpyQ:'폭풍의 눈',archon:'암흑 낫',dragon:'하늘을 태우는 숨결',demonLord:'창조와 파괴'};
function inRing(cx,cy,R,n,spd,dmg,col,gap){const o=rnd(TAU);for(let i=0;i<n;i++){const a=o+i/n*TAU;if(gap!==undefined&&Math.abs(((a-gap+Math.PI*3)%TAU)-Math.PI)<.45)continue;const x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R*.7;if(blockAt(x,y))continue;const b=ebullet(x,y,a+Math.PI,spd,dmg,col,3);b.life=R/spd*1.05}}
function vLine(x,delay,dmg,col){tlLine(x,40,Math.PI/2,G.map.ph,10,delay,dmg,col)}
function hLine(y,delay,dmg,col){tlLine(10,y,0,G.map.pw,10,delay,dmg,col)}
function bossSig(e,p){
  const T=bossT(),col=MON[e.type].bc||e.cols[1]||'#ff3a3a',oy=e.y-e.hh*.55,td=1-T*.3,sv=1+T*.5,W=G.map.pw,H=G.map.ph,dm=e.dmg;
  G.texts.push({x:e.x,y:e.y-e.hh-18,vy:-10,life:1.6,str:'《'+SIG_N[e.type]+'》',col:'#ffd84a',sc:1.1});
  switch(e.type){
    case'ratKing':{const sd=Math.random()<.5?1:-1;for(let w=0;w<3;w++)later(w*.7,()=>{if(e.dead)return;const gap=rint(1,7);for(let i=0;i<9;i++){if(i===gap||i===gap+1)continue;const y=60+i*(H-100)/8,x=sd>0?28:W-28;if(blockAt(x,y))continue;const b=ebullet(x,y,sd>0?0:Math.PI,140*sv,dm,'#c9a07a',4);b.life=8}});sfx.roar();break}
    case'shroomLord':{const n=6+Math.floor(T*4);for(let i=0;i<n;i++){const a=i/n*TAU,tx=clamp(p.x+Math.cos(a)*70,30,W-30),ty=clamp(p.y+Math.sin(a)*45,56,H-30);ezone(tx,ty,18,1.4,dm*.4,'#3a8a2a','#7ae05a');later(1.3,()=>{if(e.dead)return;for(let j=0;j<6;j++)ebullet(tx,ty-4,j/6*TAU+a,80*sv,dm*.7,'#7ae05a',3)})}break}
    case'gargLord':{const a0=Math.atan2(p.y-10-oy,p.x-e.x);for(let i=-3;i<=3;i++)tlLine(e.x,oy,a0+i*.13,320,12,1.1*td,dm*1.2,'#9aa0b0');later(1.1*td,()=>{const P=G.p,a=Math.atan2(P.y-8-oy,P.x-e.x);if(Math.abs(((a-a0+Math.PI*3)%TAU)-Math.PI)<.45&&Math.hypot(P.x-e.x,P.y-oy)<320){P.slowT=3;toast('석화! 움직임이 느려집니다')}});break}
    case'wispLord':{const n=12+Math.floor(T*6);for(let r=0;r<2;r++)for(let i=0;i<n;i++){const a=i/n*TAU,R=30+r*22,b=ebullet(e.x+Math.cos(a)*R,oy+Math.sin(a)*R*.7,a+Math.PI/2*(r?1:-1),70,dm*.8,'#bfe9ff',3);b.turn=(r?1:-1)*2.2;b.acc=.25;b.life=6}break}
    case'pharaoh':{const n=8;for(let w=0;w<2;w++){const off=w?W/n/2:0;for(let i=0;i<n;i++)vLine(30+off+i*(W-60)/n,(1+w*.9)*td,dm*1.2,'#ffd84a')}sfx.roar();break}

function bossGeneric(e,dt,p,d,ux,uy,sp){
  const d0=MON[e.type],ph2=e.hp<e.max*.5,rage=e.hp<e.max*.3,col=d0.bc,oy=e.y-e.hh*.55,T=bossT();
  if(d0.final)finalBoss(e,dt,p);
  if(d0.fly)e.z=6+Math.sin(e.t*2.4)*3;
  if(Math.random()<(rage?.6:.3))part(e.x+rnd(-e.r,e.r),e.y-rnd(0,e.hh),rnd(-6,6),rnd(-24,-8),.5,rage?'#ff3a3a':pick(e.cols),1);
  if(e.st==='spiral'){e.stT-=dt;e.atk-=dt;if(e.atk<=0){e.atk=ph2?.05:.08;const a=e.t*(3.6+T*1.5),n=e.arms||2;for(let k=0;k<n;k++)ebullet(e.x,oy,a+k*TAU/n,85*(1+T*.5),e.dmg*.7,col,3)}if(e.stT<=0)e.st='idle';return}
  if(e.st==='dash'){e.stT-=dt;chase(e,e.dx*(360+T*120)*dt,e.dy*(360+T*120)*dt,e.r-2);if(Math.random()<.8)part(e.x,e.y-10,rnd(-20,20),rnd(-20,20),.35,col,2);
    if(e.stT<=0){if(e.combo>0){e.combo--;const a=Math.atan2(p.y-e.y,p.x-e.x);e.st='wind';e.stT=.4*(1-T*.3);e.dx=Math.cos(a);e.dy=Math.sin(a);tlLine(e.x,e.y-6,a,220,e.r,e.stT,e.dmg*1.3,col)}else e.st='idle'}return}
  if(e.st==='wind'){e.stT-=dt;if(e.stT<=0){e.st='dash';e.stT=.5}return}
  const m=d>140?1:d<90?-1:0;chase(e,(ux*m-uy*.5)*sp*dt,(uy*m+ux*.5)*sp*dt,e.r-2);
  e.cd-=dt;if(e.cd>0||G.dead)return;
  e.cd=(ph2?1.5:2.3)*(1-T*.35)*(rage?.7:1);const pat=d0.pat[e.ph%d0.pat.length];e.ph++;bossPattern(e,p,pat,ph2);
  if(T>=.3&&e.ph%(ph2?2:3)===0){const zs=['grid','mines','rain','slam','meteorBig','sweep','pincer'].filter(z=>z!==pat),z=d0.pat.find(q=>zs.includes(q)&&q!==pat)||'rain';later(.35,()=>{if(!e.dead&&e.st==='idle')bossPattern(e,G.p,z,ph2)})}
  if(rage&&T>.2){const nx=d0.pat[(e.ph+1)%d0.pat.length];if(nx!=='charge'&&nx!=='combo'&&nx!=='spiral'&&nx!=='blink')later(.55,()=>{if(!e.dead&&e.st==='idle')bossPattern(e,G.p,nx,ph2)})}
}
/* 100층 마왕 바알: 75%부터 패턴 두 줄, 40%부터 심연 개방(끊임없는 4갈래 탄막), 15%부터 광폭화 */
function finalBoss(e,dt,p){

  if(e.fp<2&&k<.4){e.fp=2;banner('심연이 열립니다','탄막이 멈추지 않습니다');G.flash=.6;G.flashCol='#000000';shake(14);sfx.bigboom();ringFx(e.x,e.y,260,['#ffffff','#ff3a3a','#c94cff','#000'],1,{top:1})}

  claim(i){const q=S.quests[+i];if(!q||!q.done)return;S.gold+=q.gold;S.ess+=q.ess;S.ore+=q.ore||0;S.quests.splice(+i,1);S.quests.push(mkQuest());sfx.clear();gainXp(q.xp)},
  enter(f){closePanel();sfx.portal();fadeTo(()=>enterFloor(+f))},
  reset(){if(ui.resetArm){try{localStorage.removeItem(SAVE_KEY)}catch(e){}location.reload()}else{ui.resetArm=true}}
};
function openPanel(n){ui.open=n;ui.sel=null;ui.resetArm=false;IN.down=false;$('panel').hidden=false;refreshPanel()}
function refreshPanel(){if(!ui.open)return;const P=PANELS[ui.open],b=$('panelBody'),st=b.scrollTop;$('panelTitle').textContent=P.t;$('panelWallet').innerHTML=ui.open==='char'&&ui.tab==='inv'?'':[['gold',Math.floor(S.gold)],['ore',S.ore],['ess',S.ess],['core',S.core||0],['prot',S.prot||0]].map(([k,v])=>`<span title="${({gold:'골드',ore:'광석',ess:'정수',core:'마력 코어',prot:'파괴 방지권'})[k]}"><img src="${ICON[k]}" alt="">${v}</span>`).join('');b.innerHTML=P.r();b.scrollTop=st}
function closePanel(){ui.open=null;$('panel').hidden=true}

/* ---- 대장간 연출: 망치가 세 번 내려치고(깡! 깡! 깡!) 결과가 나온다 ---- */
const FORGE={on:false};
function forgeAnim(it,before,ok,drop,broke,saved){
  const box=$('forge'),fc=$('forgeCv'),g=fc.getContext('2d'),msg=$('forgeMsg');g.imageSmoothingEnabled=false;
  box.hidden=false;FORGE.on=true;msg.innerHTML=`<b style="color:${RAR[it.r].c}">${it.my?MYTH[it.my].n:PRE[it.r]+' '+SLOTN[it.slot]}</b> +${before} → +${before+1} <span class="dim">(${Math.round(enhRate(before)*100)}%)</span>`;
  const spr=itemSpr(it),sp=[];let t0=performance.now(),hits=0,done=false,shk=0,res=0;
  const STR=[.45,.95,1.45],END=2.1;
  function frame(){
    const t=(performance.now()-t0)/1000;g.setTransform(1,0,0,1,0,0);
    const ox=shk>0?Math.round(rnd(-shk,shk)):0;shk=Math.max(0,shk-.5);g.translate(ox,0);
    const bg=g.createRadialGradient(80,80,6,80,70,110);bg.addColorStop(0,'#5a2a14');bg.addColorStop(.5,'#22120c');bg.addColorStop(1,'#0a0606');g.fillStyle=bg;g.fillRect(-4,0,170,96);
    for(let i=0;i<6;i++){g.fillStyle=i%2?'#ff7a2a':'#ffd24a';g.fillRect(12+i*3,84-((t*40+i*13)%30),1,1)}
    pxPoly(g,[[44,62],[116,62],[112,68],[100,70],[96,82],[108,90],[52,90],[64,82],[60,70],[40,68],[30,62]],'#14121f');
    pxPoly(g,[[46,63],[114,63],[110,67],[98,69],[94,82],[104,88],[56,88],[66,82],[62,69],[42,67],[34,63]],'#4e5462');
    g.fillStyle='#8b93a7';g.fillRect(46,63,66,2);g.fillStyle='#33384d';g.fillRect(62,74,34,2);
    const glow=hits>0&&!done?1:0;if(!(done&&broke))g.drawImage(spr,80-(spr.width>>1),62-spr.height+1);
    if(glow){g.globalCompositeOperation='lighter';g.globalAlpha=.35;pxDisc(g,80,56,9,'#ff9a3c');g.globalAlpha=1;g.globalCompositeOperation='source-over'}
    let k=1;if(hits<3){k=clamp((STR[hits]-t)/.5,0,1);k=Math.sin(k*Math.PI/2)}
    if(hits<3&&t>=STR[hits]){hits++;shk=4;sfx.clang();for(let i=0;i<22;i++){const a=rnd(-Math.PI,0),s=rnd(40,140);sp.push({x:82,y:60,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.3,.7)})}}
    const th=Math.PI+1.2*k,px=134,py=60,L=50,hx=px+Math.cos(th)*L,hy=py+Math.sin(th)*L,dx=Math.cos(th),dy=Math.sin(th),nx=-dy,ny=dx;
    pxLine(g,px,py,hx,hy,'#3a1c0c');pxLine(g,px,py+1,hx,hy+1,'#a0582e');
    const P=(u,v)=>[hx+nx*u+dx*v,hy+ny*u+dy*v];
    pxPoly(g,[P(-10,-6),P(10,-6),P(10,6),P(-10,6)],'#14121f');pxPoly(g,[P(-9,-5),P(9,-5),P(9,5),P(-9,5)],'#8b93a7');pxPoly(g,[P(-9,-5),P(9,-5),P(9,-2),P(-9,-2)],'#d8dee9');
    for(let i=sp.length-1;i>=0;i--){const q=sp[i];q.l-=1/60;q.vy+=260/60;q.x+=q.vx/60;q.y+=q.vy/60;if(q.l<=0){sp.splice(i,1);continue}g.fillStyle=q.l>.3?'#fff6c0':'#ff9a3c';g.fillRect(Math.round(q.x),Math.round(q.y),1,1)}
    if(t>=END&&!done){done=true;res=t;
      if(ok){sfx.clear();for(let i=0;i<40;i++){const a=rnd(TAU),s=rnd(30,120);sp.push({x:80,y:52,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,l:rnd(.5,1)})}msg.innerHTML=`<b class="gold" style="font-size:1.4em">강화 성공!</b><br>${itemName(it)}`}
      else{sfx.err();tone('sawtooth',200,60,.5,.1);if(broke){shk=8;sfx.bigboom();for(let i=0;i<50;i++){const a=rnd(TAU),s=rnd(40,160);sp.push({x:80,y:54,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,l:rnd(.5,1.1)})}msg.innerHTML=`<b class="no" style="font-size:1.5em">장비 파괴</b><br><span class="no">${PRE[it.r]?'':''}${it.my?MYTH[it.my].n:GEAR_N[it.slot][it.v||0]} +${before}이(가) 산산조각 났습니다</span>`}
      else msg.innerHTML=`<b class="no" style="font-size:1.4em">강화 실패</b><br>${saved?`<span class="gold">파괴 방지권이 대신 깨졌습니다</span><br>`:''}${drop?`<span class="no">한 단계 내려갔습니다 → +${it.up}</span>`:'단계는 그대로입니다'}`}}
    if(done){const k=t-res;if(ok){g.globalCompositeOperation='lighter';g.globalAlpha=Math.max(0,.6-k*.5);g.fillStyle='#ffd84a';g.fillRect(70,0,20,62);g.globalAlpha=1;g.globalCompositeOperation='source-over'}
      else{for(let i=0;i<3;i++){g.globalAlpha=Math.max(0,.5-k*.3);pxDisc(g,74+i*6,54-k*20-i*3,4+k*4,'#565c73')}g.globalAlpha=1}}
    if(done&&t-res>1.6){close();return}
    requestAnimationFrame(frame)}
  function close(){if(!FORGE.on)return;FORGE.on=false;box.hidden=true;refreshPanel();updateDOM()}
  box.onclick=()=>{if(done)close()};
  requestAnimationFrame(frame);
}

/* ============================ INPUT ============================ */
function hudHit(gx,gy){for(const r of HUDR){if(r.act&&gx>=r.x&&gx<r.x+r.w&&gy>=r.y&&gy<r.y+r.h){const a=r.act;if(a.startsWith('s:'))cast(a.slice(2));else if(a==='p:hp')usePot('hp');else if(a==='p:mp')usePot('mp');else if(a==='b')blink();else if(a==='m')castMyth();return true}}return false}
function bindInput(){
  addEventListener('keydown',e=>{
    if(!G.started)return;if(['Tab','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat&&!/^Digit/.test(e.code))return;IN.keys[e.code]=true;
    if(ui.open){if(e.code==='Escape'||e.code==='Tab'||e.code==='KeyF')closePanel();return}
    const m=/^Digit([1-8])$/.exec(e.code);if(m){const i=+m[1]-1,id=S.slots[i];if(id&&i<D.slots)cast(id)}
    else if(e.code==='KeyF')tryInteract();else if(e.code==='KeyR')castMyth();else if(e.code==='Space')blink();else if(e.code==='KeyQ')usePot('hp');else if(e.code==='KeyE')usePot('mp');
    else if(e.code==='Tab'||e.code==='KeyI'||e.code==='KeyC'){ui.tab='stat';openPanel('char')}else if(e.code==='KeyK'){ui.tab='grim';openPanel('char')}else if(e.code==='KeyL')toggleScan();else if(e.code==='KeyM')toggleMute();else if(e.code==='KeyT')toggleAuto();else if(e.code==='F11'){e.preventDefault();toggleFull()}
  });
  addEventListener('keyup',e=>{IN.keys[e.code]=false});
  addEventListener('blur',()=>{IN.keys={};IN.down=false});
  const pos=e=>{const r=cv.getBoundingClientRect();IN.mx=(e.clientX-r.left)/r.width*W;IN.my=(e.clientY-r.top)/r.height*H};
  const noTouch=()=>{if(IN.touch){IN.touch=false;$('touch').style.display='none';$('joy2').style.display='none'}};cv.addEventListener('mousemove',e=>{noTouch();pos(e)});
  cv.addEventListener('mousedown',e=>{if(e.button||!G.started)return;pos(e);noTouch();if(hudHit(IN.mx,IN.my))return;const wx=IN.mx+G.cam.x,wy=IN.my+G.cam.y,p=G.p;
    for(const it of G.map.inter)if(Math.hypot(it.x-wx,it.y-10-wy)<18&&Math.hypot(it.x-p.x,it.y-p.y)<it.r+12){sfx.ui();it.act();return}IN.down=true});
  addEventListener('mouseup',()=>{IN.down=false});cv.addEventListener('contextmenu',e=>e.preventDefault());
  const joy=$('joy'),jk=$('joyK');let jo=null,ao=null;
  cv.addEventListener('touchstart',e=>{e.preventDefault();if(!G.started)return;if(!IN.touch){IN.touch=true;$('touch').style.display='block'}const r=cv.getBoundingClientRect();
    for(const t of e.changedTouches){const gx=(t.clientX-r.left)/r.width*W,gy=(t.clientY-r.top)/r.height*H;if(hudHit(gx,gy))continue;
      if(gx>W*.5&&IN.aid==null){IN.aid=t.identifier;ao={x:t.clientX,y:t.clientY};const sr=$('stage').getBoundingClientRect(),j2=$('joy2');j2.style.display='block';j2.style.left=(t.clientX-sr.left)+'px';j2.style.top=(t.clientY-sr.top)+'px';$('joy2K').style.transform='';continue}
      if(IN.jid===null){IN.jid=t.identifier;jo={x:t.clientX,y:t.clientY};const sr=$('stage').getBoundingClientRect();joy.style.display='block';joy.style.left=(t.clientX-sr.left)+'px';joy.style.top=(t.clientY-sr.top)+'px';jk.style.transform=''}}},{passive:false});
  cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===IN.aid){let dx=t.clientX-ao.x,dy=t.clientY-ao.y;const d=Math.hypot(dx,dy),mx=40;if(d>mx){dx=dx/d*mx;dy=dy/d*mx}$('joy2K').style.transform=`translate(${dx}px,${dy}px)`;if(d>8){G.p.aimA=Math.atan2(dy,dx);IN.aiming=true;IN.tfire=d>14}}else if(t.identifier===IN.jid){let dx=t.clientX-jo.x,dy=t.clientY-jo.y;const d=Math.hypot(dx,dy),mx=40;if(d>mx){dx=dx/d*mx;dy=dy/d*mx}IN.jx=dx/mx;IN.jy=dy/mx;jk.style.transform=`translate(${dx}px,${dy}px)`}},{passive:false});
  const tend=e=>{for(const t of e.changedTouches)if(t.identifier===IN.aid){IN.aid=null;IN.aiming=false;IN.tfire=false;$('joy2').style.display='none'}else if(t.identifier===IN.jid){IN.jid=null;IN.jx=IN.jy=0;joy.style.display='none'}};
  cv.addEventListener('touchend',tend);cv.addEventListener('touchcancel',tend);
  for(const[id,fn]of[['tF',tryInteract],['tB',blink]]){const el=$(id);el.onclick=fn;el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();fn()},{passive:false})}
  $('panelBody').addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const i=t.dataset.a.indexOf(':'),a=i<0?t.dataset.a:t.dataset.a.slice(0,i),arg=i<0?undefined:t.dataset.a.slice(i+1);if(ACT[a]){ACT[a](arg);refreshPanel();save()}});
  $('panelX').onclick=closePanel;$('panel').addEventListener('mousedown',e=>{if(e.target===$('panel'))closePanel()});
  $('bBag').onclick=()=>{ui.tab='stat';openPanel('char')};$('bInv').onclick=()=>{ui.tab='inv';openPanel('char')};$('bScan').onclick=toggleScan;$('bSnd').onclick=toggleMute;$('bAuto').onclick=toggleAuto;$('bFull').onclick=toggleFull;document.addEventListener('fullscreenchange',()=>{$('bFull').textContent=document.fullscreenElement?'창 모드':'전체화면';setTimeout(resize,50)});
}
function toggleFull(){const d=document,el=d.documentElement;try{if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else{const r=(el.requestFullscreen||el.webkitRequestFullscreen);if(r)r.call(el,{navigationUI:'hide'});else toast('이 브라우저는 전체화면을 지원하지 않습니다')}}catch(e){toast('전체화면을 열 수 없습니다')}}
function toggleAuto(){S.auto=!S.auto;syncAuto();toast(S.auto?'자동 전투: 가까운 적에게 기술을 알아서 씁니다':'수동 전투: 직접 조준해서 씁니다');save()}
function syncAuto(){const b=$('bAuto');b.textContent=S.auto?'자동':'수동';b.classList.toggle('on',!!S.auto)}
function toggleScan(){S.scan=!S.scan;$('scan').classList.toggle('off',!S.scan);$('bScan').classList.toggle('muted',!S.scan);save()}
function toggleMute(){S.mute=!S.mute;if(AU.master)AU.master.gain.value=S.mute?0:.8;$('bSnd').classList.toggle('muted',S.mute);save()}
function resize(){const st=$('stage');let s=Math.min(innerWidth/W,innerHeight/H);st.style.width=W*s+'px';st.style.height=H*s+'px';st.style.fontSize=(s*8)+'px';st.style.setProperty('--px',Math.max(1,s)+'px')}

/* ============================ BOOT ============================ */
let TOWN,lastT=0;
function frame(t){
  requestAnimationFrame(frame);let dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;
  if(G.title){G.time+=dt;G.p.x=320+Math.sin(G.time*.12)*150;G.p.y=200+Math.cos(G.time*.09)*70;updParts(dt);render();return}
  if(G.hitstop>0){G.hitstop-=dt;dt=0}
  if(!ui.open&&dt>0)update(dt);
  render();updateDOM();
}
function start(el){
  if(el)S=newSave(el);initAudio();if(AU.master)AU.master.gain.value=S.mute?0:.8;
  G.p={x:320,y:150,hp:1,mp:1,face:1,walk:0,ifr:0,cd:{},mcd:0,bcd:0,pcd:0,castT:0,mvx:0,mvy:0,shield:0,shMax:1,shT:0,regen:0};recalc();G.p.hp=D.maxHp;G.p.mp=D.maxMp;
  while(S.quests.length<3)S.quests.push(mkQuest());
  $('scan').classList.toggle('off',!S.scan);$('bScan').classList.toggle('muted',!S.scan);$('bSnd').classList.toggle('muted',S.mute);syncAuto();
  $('title').hidden=true;$('pick').hidden=true;$('hud').hidden=false;G.title=false;G.parts=[];enterTown();G.started=true;
  toast('마을 사람들에게 [F]로 말을 걸어 보세요');toast(`북쪽 <b class="gold">심연의 탑</b>에서 [F]를 누르면 입장합니다`);
}
function showPick(){
  initAudio();sfx.ui();$('title').hidden=true;$('pick').hidden=false;
  $('pickGrid').innerHTML=ELS.map(el=>`<button class="pk" data-el="${el}"><img src="${ICON['hero_'+el]}" alt=""><b style="color:${EL[el].c[1]}">${ic('el_'+el)}${EL[el].n}</b><span>${EL[el].d}<br>시작 마법: ${SP[START[el]].n}</span></button>`).join('');
}
buildAssets();
(function boot(){
  const sv=loadSave();if(sv){S=sv;$('bCont').hidden=false}
  resize();addEventListener('resize',resize);
  TOWN=buildTown();G.map=TOWN;G.p={x:320,y:200,face:1};G.zone='town';bindInput();
  $('bNew').onclick=showPick;$('bCont').onclick=()=>start();
  $('pickGrid').addEventListener('click',e=>{const b=e.target.closest('.pk');if(b)start(b.dataset.el)});
  setInterval(()=>{if(G.started)save()},20000);
  requestAnimationFrame(frame);
})();
window.__game={bossPattern,bossSig,bossSig2,applyDb,itemSprForTest:itemSpr,A,update,IN,MON,THEMES,BOSSES,MYTH,mkMyth,mkItem,xpNeed,hpScale,dmgScale,openChest,spawnChest,forgeAnim,G,get S(){return S},set S(v){S=v},D,SP,SPL,recalc,enterFloor,enterTown,cast,openPanel,closePanel,start};
